<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ece9e2">
<title>文字を見せる｜対面表示</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">

    <main id="inputScreen" class="screen input-screen">
      <div class="input-card">
        <label for="messageInput" class="input-label">向かいの人に見せる文字を入力</label>
        <textarea
          id="messageInput"
          class="message-input"
          rows="1"
          placeholder="ここに入力"
          enterkeyhint="done"
          autocapitalize="off"
          autocomplete="off"
          spellcheck="false"
        ></textarea>
        <p id="errorMessage" class="error-message" hidden>文字を入力してください</p>
      </div>
      <button id="showButton" class="primary-button" type="button">表示</button>
    </main>

    <main id="displayScreen" class="screen display-screen" hidden>
      <div class="stage">
        <div class="rotator">
          <div id="displayText" class="display-text"></div>
        </div>
      </div>
      <button id="resetButton" class="secondary-button" type="button">もう一度入力</button>
    </main>

  </div>
  <script src="script.js"></script>
</body>
</html>
