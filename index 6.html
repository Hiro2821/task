<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="theme-color" content="#F5F6F4" />
<title>今日の勉強 – StudyFlow</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

<div id="app">

  <header class="topbar">
    <div class="date-nav">
      <button id="prevDate" class="date-arrow" aria-label="前の日">
        <svg width="11" height="18" viewBox="0 0 11 18" fill="none"><path d="M9.5 1.5L1.5 9L9.5 16.5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <div class="date-label" id="dateLabel">9月2日（水）</div>
      <button id="nextDate" class="date-arrow" aria-label="次の日">
        <svg width="11" height="18" viewBox="0 0 11 18" fill="none"><path d="M1.5 1.5L9.5 9L1.5 16.5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>

    <div class="header-row">
      <h1 id="pageTitle">今日の勉強</h1>
      <div class="header-actions">
        <button id="weeklyBtn" class="icon-btn-plain" aria-label="週間の記録">
          <svg width="21" height="21" viewBox="0 0 24 24" fill="none"><path d="M4 20V10M12 20V4M20 20v-7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <button id="settingsBtn" class="icon-btn-plain" aria-label="授業の管理">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M12 15.5a3.5 3.5 0 100-7 3.5 3.5 0 000 7z" stroke="currentColor" stroke-width="1.6"/><path d="M19.4 13a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V19a2 2 0 11-4 0v-.09a1.65 1.65 0 00-1-1.51 1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H4a2 2 0 110-4h.09a1.65 1.65 0 001.51-1 1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06a1.65 1.65 0 001.82.33H10a1.65 1.65 0 001-1.51V4a2 2 0 114 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 112.83 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V10a1.65 1.65 0 001.51 1H20a2 2 0 110 4h-.09a1.65 1.65 0 00-1.51 1z" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
    </div>

    <div class="progress-row">
      <div class="progress-bar-track"><div class="progress-bar-fill" id="progressFill"></div></div>
      <div class="progress-text" id="progressLabel">0 / 0 完了</div>
    </div>
  </header>

  <main id="cardList" class="card-list"></main>

  <div id="emptyState" class="empty-state hidden">
    <p class="empty-title">まだ何も置かれていません</p>
    <p class="empty-sub">右下の＋から、今日の予習・復習を追加しましょう</p>
  </div>

  <button id="addBtn" class="fab" aria-label="タスクを追加">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"/></svg>
  </button>
</div>

<!-- Add Task Sheet -->
<div id="addSheetOverlay" class="sheet-overlay hidden">
  <div class="sheet" id="addSheet">
    <div class="sheet-handle"></div>
    <h2 class="sheet-title">タスクを追加</h2>

    <div class="field-label" id="addSheetDayLabel">授業名</div>
    <div id="subjectChips" class="chip-grid"></div>
    <p id="noChipsMessage" class="no-chips-message hidden">この曜日に予定されている授業はありません</p>

    <button type="button" id="toggleOtherSubjects" class="link-btn">他の授業から選ぶ</button>
    <div id="otherSubjectsWrap" class="other-subjects-wrap hidden">
      <select id="subjectSelect" class="select-input"></select>
    </div>

    <label class="field-label">種類</label>
    <div class="type-toggle">
      <button type="button" class="type-btn active" data-type="prep">予習</button>
      <button type="button" class="type-btn" data-type="review">復習</button>
    </div>

    <div class="sheet-actions">
      <button id="cancelAdd" class="btn btn-secondary">キャンセル</button>
      <button id="confirmAdd" class="btn btn-primary">追加</button>
    </div>
  </div>
</div>

<!-- Settings / Subject management sheet -->
<div id="settingsOverlay" class="sheet-overlay hidden">
  <div class="sheet sheet-tall" id="settingsSheet">
    <div class="sheet-handle"></div>
    <h2 class="sheet-title">授業の管理</h2>
    <p class="sheet-hint">曜日ごとに、自動で追加する予習・復習を設定できます</p>

    <div class="weekday-tabs" id="weekdayTabs">
      <button type="button" class="weekday-tab" data-day="mon">月</button>
      <button type="button" class="weekday-tab" data-day="tue">火</button>
      <button type="button" class="weekday-tab" data-day="wed">水</button>
      <button type="button" class="weekday-tab" data-day="thu">木</button>
      <button type="button" class="weekday-tab" data-day="fri">金</button>
      <button type="button" class="weekday-tab" data-day="sat">土</button>
      <button type="button" class="weekday-tab" data-day="sun">日</button>
    </div>

    <div id="subjectManageList" class="subject-manage-list"></div>

    <div class="new-subject-row">
      <input type="text" id="newSubjectInput" class="text-input" placeholder="新しい授業名を入力" />
      <button id="addSubjectBtn" class="btn btn-primary btn-compact">追加</button>
    </div>

    <button id="closeSettings" class="btn btn-secondary" style="margin-top:14px;width:100%;">閉じる</button>
  </div>
</div>

<!-- Weekly summary sheet -->
<div id="weeklyOverlay" class="sheet-overlay hidden">
  <div class="sheet sheet-tall" id="weeklySheet">
    <div class="sheet-handle"></div>
    <h2 class="sheet-title">週間の記録</h2>

    <div class="week-nav">
      <button id="prevWeek" class="date-arrow" aria-label="前の週">
        <svg width="11" height="18" viewBox="0 0 11 18" fill="none"><path d="M9.5 1.5L1.5 9L9.5 16.5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <div class="week-range" id="weekRangeLabel">9月8日 〜 9月14日</div>
      <button id="nextWeek" class="date-arrow" aria-label="次の週">
        <svg width="11" height="18" viewBox="0 0 11 18" fill="none"><path d="M1.5 1.5L9.5 9L1.5 16.5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>

    <div class="week-total-row">
      <div class="progress-bar-track"><div class="progress-bar-fill" id="weekTotalFill"></div></div>
      <div class="progress-text" id="weekTotalLabel">0 / 0 完了</div>
    </div>

    <div id="weekDayList" class="week-day-list"></div>

    <button id="closeWeekly" class="btn btn-secondary" style="margin-top:14px;width:100%;">閉じる</button>
  </div>
</div>

<!-- Generic confirm sheet (used for deletes) -->
<div id="confirmOverlay" class="sheet-overlay hidden">
  <div class="sheet sheet-confirm" id="confirmSheet">
    <p id="confirmMessage" class="confirm-message"></p>
    <div class="sheet-actions">
      <button id="confirmCancel" class="btn btn-secondary">キャンセル</button>
      <button id="confirmOk" class="btn btn-danger">削除する</button>
    </div>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
